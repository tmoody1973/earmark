name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders so env parsing and the Clerk build never need real values.
      BEE_TOKEN: ci
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      EARMARK_WEBHOOK_SECRET: replace-me-ci-placeholder-secret
      EARMARK_OWNER_CLERK_ID: user_ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0 (pnpm version comes from package.json packageManager)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      # Vercel's eve service runs `eve build` from the repo root, evaluating agent/ outside Next (so next/* can't
      # resolve there). `next build` alone never does this. Sandbox prewarm needs Vercel credentials; skip it here.
      - run: node node_modules/eve/bin/eve.js build --skip-sandbox-prewarm

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Pinned CLI v8.30.1; sha256 is from the release's gitleaks_8.30.1_checksums.txt.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full history
        run: ./gitleaks git --config .gitleaks.toml --redact -v
